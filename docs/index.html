<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteirinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-tema="dino"]{--bg:#E4F5DC;--card:#fff;--ink:#16301F;--muted:#3F5F49;--hero:#1F7A47;--hero-ink:#fff;--lime:#B8EB4B;--call:#FF9F2E;--call-ink:#2B1500;--egg:#FFF1C7;--line:#B9DDB0}
[data-tema="espaco"]{--bg:#E9ECFF;--card:#fff;--ink:#1A1B4B;--muted:#4A4D86;--hero:#33307A;--hero-ink:#fff;--lime:#FFD84D;--call:#FF6FA5;--call-ink:#2B0017;--egg:#DCD9FF;--line:#C3C6F0}
[data-tema="mar"]{--bg:#DFF4FA;--card:#fff;--ink:#0E3550;--muted:#3C6580;--hero:#0F7BA8;--hero-ink:#fff;--lime:#FFE27A;--call:#FF7A59;--call-ink:#2B0D00;--egg:#CFEFF7;--line:#AEDDEA}
[data-tema="unicornio"]{--bg:#FDEBF6;--card:#fff;--ink:#3B1747;--muted:#7A4A8A;--hero:#B03FA8;--hero-ink:#fff;--lime:#FFE066;--call:#FF8FC7;--call-ink:#3B0A2E;--egg:#FFE3F3;--line:#F2C3E3}
[data-tema="princesas"]{--bg:#F2ECFF;--card:#fff;--ink:#2D1B5E;--muted:#6A58A0;--hero:#6A3FC4;--hero-ink:#fff;--lime:#FFD166;--call:#FF7FA8;--call-ink:#3A0B1F;--egg:#FFF1CC;--line:#D8CBF5}
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-size:180px 180px;color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.15rem;line-height:1.5}
main{max-width:30rem;margin:0 auto;padding:1.25rem 1.1rem 1.5rem}
.hero{position:relative;background:var(--hero);color:var(--hero-ink);border:3px solid var(--ink);border-radius:1.75rem;padding:1.5rem 1.25rem;text-align:center;margin-bottom:1.25rem;overflow:hidden}
.hero .deco{position:absolute;top:.5rem;font-size:2rem}
.hero .deco.l{left:.75rem}.hero .deco.r{right:.75rem}
.avatar{width:6.5rem;height:6.5rem;margin:0 auto .5rem;border-radius:50%;background:var(--lime);border:3px solid var(--ink);display:grid;place-items:center;font-size:3.75rem;object-fit:cover}
img.avatar{display:block}
h1{margin:0;font-size:2rem;line-height:1.15;font-weight:700}
.full{margin:.4rem 0 0;font-weight:600}
.lead{margin:.5rem 0 0;font-size:1.05rem}
.call{display:flex;align-items:center;justify-content:center;gap:.75rem;text-align:center;min-height:5rem;padding:1rem 1.25rem;margin:0 0 1.5rem;background:var(--call);color:var(--call-ink);font-size:1.4rem;font-weight:700;text-decoration:none;border:3px solid var(--ink);border-radius:1.5rem}
.call .ico{font-size:2rem}.call small{display:block;font-weight:600;font-size:1rem}
section{margin:0 0 1.5rem}
h2{margin:0 0 .75rem;font-size:1.35rem;font-weight:700}
.egg{background:var(--egg);border:2px dashed var(--ink);border-radius:50% 50% 1.5rem 1.5rem/2rem 2rem 1.5rem 1.5rem;padding:1.25rem 1.25rem 1rem}
.egg h2{margin-bottom:.4rem}.egg p{margin:0}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.tips li{display:flex;align-items:center;gap:.85rem;background:var(--card);border:2px solid var(--line);border-radius:1.25rem;padding:.75rem 1rem}
.tips .ico{flex:none;font-size:1.75rem;width:2.25rem;text-align:center}
.tips a{color:var(--ink);font-weight:600}
p{margin:0 0 .75rem}
.ghost{display:inline-flex;align-items:center;min-height:3rem;padding:.6rem 1.25rem;border:3px solid var(--hero);color:var(--ink);background:var(--card);font:inherit;font-weight:600;text-decoration:none;border-radius:999px}
.laudo{margin:0 0 1rem;background:var(--card);border:2px solid var(--line);border-radius:1.25rem;padding:.25rem 1rem}
.laudo summary{cursor:pointer;min-height:3rem;display:flex;align-items:center;font-weight:700}
.laudo .hint{font-size:.95rem;color:var(--muted)}
.laudo figure{margin:0 0 1rem}
.laudo img{display:block;width:100%;height:auto;border-radius:.75rem;border:2px solid var(--line);background:#fff}
.laudo figcaption{font-size:.9rem;color:var(--muted);margin-top:.35rem;text-align:center}
a:focus-visible,summary:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
footer{color:var(--muted);font-size:.9rem;text-align:center;padding-top:.5rem}
.scene{background:var(--hero);border-top:3px solid var(--ink);text-align:center;font-size:2rem;line-height:1;padding:1rem .5rem 1.1rem;letter-spacing:.4rem}
</style>
</head>
<body>
<script>
/* ==========================================================
   EDITE SÓ ESTE BLOCO PARA CADA CRIANÇA. O resto não muda.
   Os dados abaixo são FICTÍCIOS (exemplo para divulgação).
   ========================================================== */
const DADOS = {
  tema: "dino",                      // "dino", "espaco", "mar", "unicornio" ou "princesas"
  nome: "Pedro",                     // como a criança é chamada
  artigo: "o",                       // "o" (Eu sou o Pedro), "a" (Eu sou a Ana) ou "" (sem artigo)
  nomeCompleto: "Pedro Exemplo da Silva",
  apresentacao: "Eu tenho TDAH. Meu cérebro funciona de um jeito diferente.",
  explicacao: "Às vezes eu me distraio fácil, tenho muita energia e dificuldade de esperar. Não é birra nem falta de educação.",
  foto: "",                          // ex.: "foto.jpg" (arquivo na mesma pasta). Vazio = usa o ícone do tema
  responsaveis: [                    // o primeiro (ou o indicado em contatoPrincipal) vira o botão grande
    { nome: "Mãe: Maria Exemplo", telefone: "79900000000" },
    { nome: "Pai: João Exemplo",  telefone: "79911111111" }
  ],
  contatoPrincipal: 0,
  dicas: [
    ["🗣️", "Fale comigo com calma, em frases curtas."],
    ["☝️", "Peça uma coisa de cada vez."],
    ["🎧", "Me deixe fazer uma pausa num lugar tranquilo."],
    ["⏳", "Me dê um tempinho para responder."]
  ],
  // Padrão: SEM laudo na página. Só coloque se a família pedir (qualquer pessoa com o QR code poderá ver).
  laudos: [],                        // ex.: ["laudo1.jpg", "laudo2.jpg"]
  textoLaudo: ""                     // ex.: "Diagnóstico confirmado por neuropediatra (CID-10 F90.0)."
};
/* ========================= fim do bloco ========================= */

const svg = (cor, corpo) => 'url("data:image/svg+xml,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><g fill="${cor}" fill-opacity="0.14" stroke="none">${corpo}</g></svg>`) + '")';
const pegada = t => `<g transform="${t}"><circle cx="-10" cy="-14" r="5"/><circle cx="0" cy="-19" r="5"/><circle cx="10" cy="-14" r="5"/><ellipse rx="11" ry="9"/></g>`;
const TEMAS = {
  dino: { avatar: "🦖", oi: "Rawr! Eu sou", cor: "#1F7A47", deco: "🌿", cena: "🌋 🦕 🌴 🦖 🌿",
    ico: { sobre: "🥚", resp: "🐾", ajuda: "🦕", doc: "🦴" },
    fundo: c => svg(c, pegada("translate(34 52) rotate(-10)") + pegada("translate(124 142) rotate(28)") +
      '<path d="M118 60Q124 30 154 32Q152 60 118 60Z"/><rect x="28" y="134" width="44" height="7" rx="3.5"/><circle cx="28" cy="132" r="5.5"/><circle cx="28" cy="143" r="5.5"/><circle cx="72" cy="132" r="5.5"/><circle cx="72" cy="143" r="5.5"/><ellipse cx="162" cy="96" rx="9" ry="12"/>') },
  espaco: { avatar: "🚀", oi: "Olá, terráqueo! Eu sou", cor: "#33307A", deco: "⭐", cena: "🌙 🚀 ⭐ 🪐 👽",
    ico: { sobre: "🪐", resp: "⭐", ajuda: "🚀", doc: "📄" },
    fundo: c => svg(c, '<path d="M40 30l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><path d="M130 110l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/><circle cx="110" cy="40" r="3"/><circle cx="30" cy="120" r="2.5"/><circle cx="160" cy="60" r="2"/><circle cx="80" cy="150" r="3.5"/>') },
  mar: { avatar: "🐙", oi: "Glub glub! Eu sou", cor: "#0F7BA8", deco: "🐚", cena: "🌊 🐠 🐚 🐙 🐢",
    ico: { sobre: "🐚", resp: "🐠", ajuda: "🐢", doc: "⚓" },
    fundo: c => svg(c, '<circle cx="40" cy="40" r="12"/><circle cx="46" cy="34" r="3" fill="#fff"/><circle cx="130" cy="70" r="8"/><circle cx="90" cy="140" r="14"/><circle cx="150" cy="150" r="5"/><circle cx="20" cy="130" r="6"/>') },
  unicornio: { avatar: "🦄", oi: "Oi, oi! Eu sou", cor: "#B03FA8", deco: "🌈", cena: "🌈 🦄 ✨ 🧚 🌸",
    ico: { sobre: "✨", resp: "💖", ajuda: "🦄", doc: "📜" },
    fundo: c => svg(c, '<path transform="translate(40 50)" d="M0 -4C-6 -12 -16 -4 0 10C16 -4 6 -12 0 -4Z"/><path d="M130 30l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><path transform="translate(120 130) scale(.8)" d="M0 -4C-6 -12 -16 -4 0 10C16 -4 6 -12 0 -4Z"/><circle cx="80" cy="100" r="4"/><circle cx="30" cy="140" r="3"/><circle cx="160" cy="90" r="3"/><path d="M70 20l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>') },
  princesas: { avatar: "👑", oi: "Olá, reino! Eu sou", cor: "#6A3FC4", deco: "👑", cena: "🏰 👑 💎 🌹 ✨",
    ico: { sobre: "💎", resp: "🏰", ajuda: "👑", doc: "📜" },
    fundo: c => svg(c, '<path transform="translate(40 50)" d="M-12 8L-14 -8L-6 -2L0 -12L6 -2L14 -8L12 8Z"/><path transform="translate(130 120) scale(.8)" d="M-12 8L-14 -8L-6 -2L0 -12L6 -2L14 -8L12 8Z"/><path transform="translate(135 40)" d="M0 -10L8 0L0 10L-8 0Z"/><path transform="translate(30 130) scale(.8)" d="M0 -10L8 0L0 10L-8 0Z"/><path d="M85 85l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><circle cx="165" cy="90" r="3"/><circle cx="80" cy="160" r="3"/>') }
};

const D = DADOS, nomeTema = TEMAS[D.tema] ? D.tema : "dino", T = TEMAS[nomeTema];
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === "class" ? e.className = v : e.setAttribute(k, v);
  kids.flat().forEach(c => e.append(c));
  return e;
};
const dig = t => String(t).replace(/\D/g, "");
const intl = t => { const d = dig(t); return d.length > 11 ? d : "55" + d; };
const fmt = t => { const d = dig(t); return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : t; };

document.documentElement.dataset.tema = nomeTema;
document.title = "Carteirinha de " + D.nome;
document.body.style.backgroundImage = T.fundo(T.cor);

const principal = D.responsaveis[D.contatoPrincipal || 0];
const wa = "https://wa.me/" + intl(principal.telefone) + "?text=" + encodeURIComponent("Olá! Preciso falar com o responsável por " + D.nome + ".");

const hero = h("div", { class: "hero" },
  h("span", { class: "deco l", "aria-hidden": "true" }, T.deco),
  h("span", { class: "deco r", "aria-hidden": "true" }, T.deco),
  D.foto ? h("img", { class: "avatar", src: D.foto, alt: "Foto de " + D.nome })
         : h("div", { class: "avatar", "aria-hidden": "true" }, T.avatar),
  h("h1", {}, T.oi + " " + (D.artigo ? D.artigo + " " : "") + D.nome + "!"),
  h("p", { class: "full" }, D.nomeCompleto),
  h("p", { class: "lead" }, D.apresentacao));

const chamar = h("a", { class: "call", href: "tel:+" + intl(principal.telefone) },
  h("span", { class: "ico", "aria-hidden": "true" }, "📞"),
  h("span", {}, "Ligar para meus responsáveis", h("small", {}, fmt(principal.telefone))));

const sobre = h("section", { class: "egg" }, h("h2", {}, T.ico.sobre + " O que é isso?"), h("p", {}, D.explicacao));

const resp = h("section", {}, h("h2", {}, T.ico.resp + " Meus responsáveis"),
  h("ul", { class: "tips" }, D.responsaveis.map(r =>
    h("li", {}, h("span", { class: "ico", "aria-hidden": "true" }, "📞"),
      h("span", {}, r.nome + " · ", h("a", { href: "tel:+" + intl(r.telefone) }, fmt(r.telefone)))))));

const ajuda = h("section", {}, h("h2", {}, T.ico.ajuda + " O que me ajuda"),
  h("ul", { class: "tips" }, D.dicas.map(([i, t]) =>
    h("li", {}, h("span", { class: "ico", "aria-hidden": "true" }, i), t))));

const doc = h("section", {}, h("h2", {}, T.ico.doc + (D.laudos.length ? " Comprovante médico" : " Documentos médicos")));
if (D.laudos.length) {
  if (D.textoLaudo) doc.append(h("p", {}, D.textoLaudo));
  doc.append(h("details", { class: "laudo" },
    h("summary", {}, "Ver os laudos"),
    h("p", { class: "hint" }, "Para escola, empresa ou órgão público comprovar o diagnóstico. Dá para ampliar com os dedos."),
    D.laudos.map((src, i) => h("figure", {}, h("img", { src, alt: "Laudo " + (i + 1), loading: "lazy" }), h("figcaption", {}, "Laudo " + (i + 1))))));
} else {
  doc.append(h("p", {}, "Eles não ficam aqui. Escola e profissionais de saúde podem pedir aos meus responsáveis."));
}
doc.append(h("a", { class: "ghost", href: wa }, "Falar com o responsável"));

document.body.append(
  h("main", {}, hero, chamar, sobre, resp, ajuda, doc, h("footer", {}, "Informações divulgadas com autorização dos responsáveis.")),
  h("div", { class: "scene", "aria-hidden": "true" }, T.cena));
</script>
</body>
</html>
